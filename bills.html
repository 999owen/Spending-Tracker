<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bills | Owen's Spending Tracker</title>
    <!-- Include FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-outer: #0A0A0A;
            --bg-inner: #101010;
            --panel-bg: #161B22;
            --border-color: #2D333B;
            --text-main: #E6EDF3;
            --text-muted: #8B949E;
            --accent-green: #4ADE80;
            --accent-blue: #60A5FA;
            --accent-red: #F87171;
            --sidebar-width: 240px;
            --font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-outer);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .main-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* Left Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-inner);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .sidebar-logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s var(--ease-in-out), color 0.2s var(--ease-in-out);
        }

        .sidebar-menu-item i {
            width: 18px;
            text-align: center;
        }

        .sidebar-menu-item:hover, .sidebar-menu-item.active {
            background-color: #1F2937;
            color: var(--text-main);
        }

        .sidebar-menu-item.active {
            font-weight: 600;
            border: 1px solid rgba(96, 165, 250, 0.2);
            box-shadow: 0 0 10px rgba(96, 165, 250, 0.1);
        }

        /* Main Content Area */
        .content-area {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        .main-dashboard-content {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .header {
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
        }

        /* Entry Panels */
        .panels-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 1024px) {
            .panels-grid {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background-color: var(--panel-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 25px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .panel-header h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            color: var(--text-main);
        }

        th, td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* Delete Button Styling */
        .delete-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            padding: 5px;
            transition: color 0.2s var(--ease-in-out);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .delete-btn:hover {
            color: var(--accent-red);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        input[type="text"], input[type="number"], input[type="date"], select {
            flex: 1;
            background-color: #1A1A1A;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            transition: border-color 0.2s var(--ease-in-out);
        }

        input[type="date"] {
            flex: 0.7;
            min-width: 120px;
        }

        input[type="number"] {
            flex: 0.7;
            min-width: 100px;
        }

        select {
            flex: 1;
            min-width: 150px;
        }

        input[type="text"] {
            flex: 1.5;
            min-width: 150px;
        }

        ::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.6;
            cursor: pointer;
        }

        input:focus {
            outline: none;
            border-color: rgba(96, 165, 250, 0.5);
            box-shadow: 0 0 10px rgba(96, 165, 250, 0.1);
        }

        button.neon-btn {
            background-color: var(--bg-inner);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.2s, border-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button.neon-btn:hover {
            background-color: #1F2937;
            border-color: rgba(96, 165, 250, 0.4);
        }

        .quick-tags {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .quick-tag-btn {
            background-color: #1A1A1A;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-tag-btn:hover {
            background-color: #1F2937;
            color: var(--text-main);
            border-color: rgba(96, 165, 250, 0.4);
        }

        .category-badge {
            display: inline-block;
            background-color: rgba(96, 165, 250, 0.1);
            color: var(--accent-blue);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            margin-left: 8px;
            font-weight: 600;
            vertical-align: middle;
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: auto;
                padding: 10px;
                box-sizing: border-box;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
                gap: 5px;
            }
            .sidebar-logo {
                width: 100%;
                margin-bottom: 10px;
                justify-content: center;
            }
            .sidebar-menu-item {
                flex: 1;
                justify-content: center;
                padding: 8px;
                font-size: 12px;
            }
            .sidebar > div {
                margin-top: 0 !important;
                flex: 1;
                display: flex;
            }
            .sidebar > div > .sidebar-menu-item {
                width: 100%;
            }
            .content-area {
                padding: 15px;
                box-sizing: border-box;
            }
            .input-group {
                flex-direction: column;
            }
            input[type="date"], input[type="number"], input[type="text"], select, button.neon-btn {
                width: 100%;
                box-sizing: border-box;
                flex: none;
            }
            .panel {
                overflow-x: auto;
            }
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-content {
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 400px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
            font-size: 14px;
        }
        .form-group input[type="text"],
        .form-group input[type="number"] {
            width: 100%;
            padding: 10px;
            background: var(--bg-inner);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-main);
            font-family: inherit;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }
        .add-btn {
            background: rgba(96, 165, 250, 0.1);
            color: var(--accent-blue);
            border: 1px solid rgba(96, 165, 250, 0.2);
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s var(--ease-in-out);
        }
        .add-btn:hover {
            background: rgba(96, 165, 250, 0.2);
        }
        .cancel-btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s var(--ease-in-out);
        }
        .cancel-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }
</style>
</head>
<body>

    <div class="main-container">

        <div class="sidebar">
            <div class="sidebar-logo"><i class="fas fa-coins"></i> Owen's Tracker</div>
            <a href="dashboard.html" class="sidebar-menu-item"><i class="fas fa-th-large"></i> Dashboard</a>
            <a href="entries.html" class="sidebar-menu-item"><i class="fas fa-list"></i> Entries</a>
            <a href="grocery.html" class="sidebar-menu-item"><i class="fas fa-shopping-cart"></i> Groceries</a>

            <div style="margin-top: auto;">
                <a href="settings.html" class="sidebar-menu-item"><i class="fas fa-cog"></i> Settings</a>
            </div>
        </div>

        <div class="content-area">
            <div class="header-container" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                <h2 style="margin:0;"><i class="fas fa-file-invoice-dollar" style="color: var(--accent-blue);"></i> Recurring Bills</h2>
                <button class="add-btn" onclick="openBillModal()" style="padding: 8px 16px; font-weight: 600;"><i class="fas fa-plus"></i> Add Bill</button>
            </div>

            <!-- Summary Banner -->
            <div style="display: flex; gap: 20px; margin-bottom: 25px; flex-wrap: wrap;">
                <div class="card" style="flex: 1; min-width: 200px;">
                    <div style="font-size: 14px; color: var(--text-muted);">Total Fixed</div>
                    <div id="summary-fixed" class="amount" style="font-size: 28px; margin-top: 5px;">$0.00</div>
                </div>
                <div class="card" style="flex: 1; min-width: 200px;">
                    <div style="font-size: 14px; color: var(--text-muted);">Total Variable</div>
                    <div id="summary-variable" class="amount" style="font-size: 28px; margin-top: 5px;">$0.00</div>
                </div>
                <div class="card" style="flex: 1; min-width: 200px; border-top: 3px solid var(--accent-red);">
                    <div style="font-size: 14px; color: var(--text-muted);">Projected Monthly</div>
                    <div id="summary-projected" class="amount text-red" style="font-size: 28px; margin-top: 5px;">$0.00</div>
                </div>
            </div>

            <!-- Bills List container -->
            <div id="bills-container" style="display: flex; flex-direction: column; gap: 15px; overflow-y: auto; max-height: calc(100vh - 250px); padding-right: 10px;">
                <!-- Filled by JS -->
            </div>
        <!-- Add/Edit Bill Modal -->
    <div id="billModal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-top:0;" id="billModalTitle">Add Bill</h3>
            <input type="hidden" id="bill-id">

            <div class="form-group">
                <label>Name</label>
                <input type="text" id="bill-name" placeholder="e.g. Apartment Rent, Electric" required>
            </div>

            <div class="form-group" style="display: flex; gap: 15px; margin-bottom: 15px;">
                <label style="display: flex; align-items: center; gap: 5px;">
                    <input type="radio" name="bill-type" value="fixed" checked> Fixed
                </label>
                <label style="display: flex; align-items: center; gap: 5px;">
                    <input type="radio" name="bill-type" value="variable"> Variable
                </label>
            </div>

            <div class="form-group">
                <label id="bill-amount-label">Monthly Cost</label>
                <input type="number" id="bill-amount" step="0.01" min="0" placeholder="0.00" required>
            </div>

            <div class="form-group">
                <label>Day Due (1-31)</label>
                <input type="number" id="bill-dueday" min="1" max="31" placeholder="1 (Default: Start of month)">
            </div>

            <div class="form-group">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="bill-autopaid"> Auto-Paid
                </label>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="add-btn" style="flex:1;" onclick="saveBill()">Save</button>
                <button class="cancel-btn" style="flex:1;" onclick="closeBillModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Update Actual Amount Modal -->
    <div id="actualModal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-top:0;">Update Actual Amount</h3>
            <input type="hidden" id="actual-bill-id">

            <div class="form-group">
                <label>Current Month Actual</label>
                <input type="number" id="actual-amount" step="0.01" min="0" placeholder="Exact statement amount">
            </div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="add-btn" style="flex:1;" onclick="saveActualAmount()">Confirm</button>
                <button class="cancel-btn" style="flex:1;" onclick="closeActualModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="store.js?v=3"></script>
    <script>
        let db = TrackerStore.load();
        let moneyFormatter = TrackerStore.formatter(db);

        TrackerStore.markActiveNav();

        function renderBills() {
            db = TrackerStore.load();
            moneyFormatter = TrackerStore.formatter(db);

            let totalFixed = 0;
            let totalVariable = 0;
            let projected = 0;

            const container = document.getElementById('bills-container');
            container.innerHTML = '';

            const currentMonth = new Date().getFullYear() + '-' + String(new Date().getMonth() + 1).padStart(2, '0');
            let dbUpdated = false;

            // Mutate db silently to avoid triggering render loop
            (db.recurring_bills || []).forEach(bill => {
                if (bill.type === 'variable' && bill.actualAmount !== null && bill.lastUpdatedMonth !== currentMonth) {
                    bill.actualAmount = null;
                    bill.lastUpdatedMonth = null;
                    dbUpdated = true;
                }
            });

            if (dbUpdated) {
                TrackerStore.save(db, true);
            }

            const bills = (db.recurring_bills || []).sort((a, b) => a.dueDay - b.dueDay);

            if (bills.length === 0) {
                container.innerHTML = '<div class="card" style="text-align: center; color: var(--text-muted); padding: 40px;">No recurring bills added yet.</div>';
            }

            bills.forEach(bill => {
                let cost = bill.amount;
                if (bill.type === 'variable' && bill.actualAmount !== null) {
                    cost = bill.actualAmount;
                }

                if (bill.isActive) {
                    if (bill.type === 'fixed') totalFixed += cost;
                    else totalVariable += cost;
                    projected += cost;
                }

                const card = document.createElement('div');
                card.className = 'card';
                card.style.display = 'flex';
                card.style.justifyContent = 'space-between';
                card.style.alignItems = 'center';
                if (!bill.isActive) card.style.opacity = '0.5';

                const left = document.createElement('div');
                const title = document.createElement('div');
                title.style.fontWeight = 'bold';
                title.style.fontSize = '16px';
                title.textContent = bill.name;

                const meta = document.createElement('div');
                meta.style.fontSize = '12px';
                meta.style.color = 'var(--text-muted)';
                meta.style.marginTop = '4px';

                let typeBadge = bill.type === 'fixed' ? '<span style="color: var(--accent-blue);">Fixed</span>' : '<span style="color: var(--accent-yellow);">Variable</span>';
                let autoBadge = bill.isAutoPaid ? ' | Auto-paid' : '';

                meta.innerHTML = `Due: Day ${bill.dueDay} | ${typeBadge}${autoBadge}`;

                left.appendChild(title);
                left.appendChild(meta);

                const right = document.createElement('div');
                right.style.display = 'flex';
                right.style.alignItems = 'center';
                right.style.gap = '15px';

                const amtDiv = document.createElement('div');
                amtDiv.style.textAlign = 'right';

                const amtSpan = document.createElement('div');
                amtSpan.className = 'amount';
                amtSpan.textContent = moneyFormatter.format(cost);

                amtDiv.appendChild(amtSpan);

                if (bill.type === 'variable') {
                    const estSpan = document.createElement('div');
                    estSpan.style.fontSize = '11px';
                    estSpan.style.color = 'var(--text-muted)';
                    if (bill.actualAmount !== null) {
                        estSpan.textContent = `Est: ${moneyFormatter.format(bill.amount)}`;
                    } else {
                        estSpan.textContent = 'Estimated';
                    }
                    amtDiv.appendChild(estSpan);

                    const updateBtn = document.createElement('button');
                    updateBtn.className = 'add-btn';
                    updateBtn.style.padding = '4px 8px';
                    updateBtn.style.fontSize = '11px';
                    updateBtn.style.background = 'transparent';
                    updateBtn.style.border = '1px solid var(--accent-yellow)';
                    updateBtn.style.color = 'var(--accent-yellow)';
                    updateBtn.textContent = 'Actual';
                    updateBtn.onclick = () => openActualModal(bill);
                    right.appendChild(updateBtn);
                }

                const actions = document.createElement('div');
                actions.style.display = 'flex';
                actions.style.gap = '10px';

                const toggleBtn = document.createElement('i');
                toggleBtn.className = bill.isActive ? 'fas fa-eye' : 'fas fa-eye-slash';
                toggleBtn.style.cursor = 'pointer';
                toggleBtn.style.color = 'var(--text-muted)';
                toggleBtn.title = bill.isActive ? 'Deactivate' : 'Activate';
                toggleBtn.onclick = () => {
                    TrackerStore.updateBill(bill.id, { isActive: !bill.isActive });
                };

                const editBtn = document.createElement('i');
                editBtn.className = 'fas fa-edit';
                editBtn.style.cursor = 'pointer';
                editBtn.style.color = 'var(--accent-blue)';
                editBtn.onclick = () => openBillModal(bill);

                const delBtn = document.createElement('i');
                delBtn.className = 'fas fa-trash';
                delBtn.style.cursor = 'pointer';
                delBtn.style.color = 'var(--accent-red)';
                delBtn.onclick = () => {
                    if (confirm('Delete this bill?')) {
                        TrackerStore.deleteBill(bill.id);
                    }
                };

                actions.appendChild(toggleBtn);
                actions.appendChild(editBtn);
                actions.appendChild(delBtn);

                right.appendChild(amtDiv);
                right.appendChild(actions);

                card.appendChild(left);
                card.appendChild(right);
                container.appendChild(card);
            });

            document.getElementById('summary-fixed').textContent = moneyFormatter.format(totalFixed);
            document.getElementById('summary-variable').textContent = moneyFormatter.format(totalVariable);
            document.getElementById('summary-projected').textContent = moneyFormatter.format(projected);
        }

        // Modals
        function openBillModal(bill = null) {
            document.getElementById('bill-id').value = bill ? bill.id : '';
            document.getElementById('bill-name').value = bill ? bill.name : '';
            document.getElementById('bill-amount').value = bill ? bill.amount : '';
            document.getElementById('bill-dueday').value = bill ? bill.dueDay : '';
            document.getElementById('bill-autopaid').checked = bill ? bill.isAutoPaid : false;

            const typeRadios = document.querySelectorAll('input[name="bill-type"]');
            typeRadios.forEach(r => {
                r.checked = bill ? r.value === bill.type : r.value === 'fixed';
            });
            updateAmountLabel();

            document.getElementById('billModalTitle').textContent = bill ? 'Edit Bill' : 'Add Bill';
            document.getElementById('billModal').classList.add('show');
        }

        function closeBillModal() {
            document.getElementById('billModal').classList.remove('show');
        }

        function updateAmountLabel() {
            const isVariable = document.querySelector('input[name="bill-type"][value="variable"]').checked;
            document.getElementById('bill-amount-label').textContent = isVariable ? 'Estimated Cost' : 'Monthly Cost';
        }

        document.querySelectorAll('input[name="bill-type"]').forEach(r => {
            r.addEventListener('change', updateAmountLabel);
        });

        function saveBill() {
            const id = document.getElementById('bill-id').value;
            const name = document.getElementById('bill-name').value;
            const type = document.querySelector('input[name="bill-type"]:checked').value;
            const amount = document.getElementById('bill-amount').value;
            const dueDay = document.getElementById('bill-dueday').value;
            const isAutoPaid = document.getElementById('bill-autopaid').checked;

            if (!name || !amount) {
                alert('Name and amount are required.');
                return;
            }

            const data = {
                name,
                type,
                amount,
                dueDay: dueDay || 1,
                isAutoPaid
            };

            try {
                if (id) {
                    TrackerStore.updateBill(id, data);
                } else {
                    TrackerStore.addBill(data);
                }
                closeBillModal();
            } catch (err) {
                alert(err.message);
            }
        }

        function openActualModal(bill) {
            document.getElementById('actual-bill-id').value = bill.id;
            document.getElementById('actual-amount').value = bill.actualAmount !== null ? bill.actualAmount : '';
            document.getElementById('actualModal').classList.add('show');
        }

        function closeActualModal() {
            document.getElementById('actualModal').classList.remove('show');
        }

        function saveActualAmount() {
            const id = document.getElementById('actual-bill-id').value;
            const amtStr = document.getElementById('actual-amount').value;

            let actualAmount = null;
            let lastUpdatedMonth = null;
            if (amtStr.trim() !== '') {
                actualAmount = parseFloat(amtStr);
                const d = new Date();
                lastUpdatedMonth = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
            }

            TrackerStore.updateBill(id, { actualAmount, lastUpdatedMonth });
            closeActualModal();
        }

        TrackerStore.subscribe(renderBills);
        renderBills();
    </script>
