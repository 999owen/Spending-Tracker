<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groceries - Advanced Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-outer: #0A0A0A; 
            --bg-inner: #101010;
            --panel-bg: #161B22; 
            --border-color: #2D333B; 
            --text-main: #E6EDF3;
            --text-muted: #8B949E;
            --accent-green: #4ADE80; 
            --accent-blue: #60A5FA; 
            --accent-red: #F87171; 
            --sidebar-width: 240px;
            --font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-outer);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .main-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* Left Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-inner);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .sidebar-logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s var(--ease-in-out), color 0.2s var(--ease-in-out);
        }

        .sidebar-menu-item i {
            width: 18px;
            text-align: center;
        }

        .sidebar-menu-item:hover, .sidebar-menu-item.active {
            background-color: #1F2937;
            color: var(--text-main);
        }

        .sidebar-menu-item.active {
            font-weight: 600;
            border: 1px solid rgba(96, 165, 250, 0.2);
            box-shadow: 0 0 10px rgba(96, 165, 250, 0.1);
        }

        /* Main Content Area */
        .content-area {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        .main-dashboard-content {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .header {
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
        }

        /* Entry Panels */
        .panels-grid {
            display: grid;
            grid-template-columns: 1fr; /* Single column for a wider grocery list */
            gap: 30px;
        }

        .panel {
            background-color: var(--panel-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 25px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .panel-header h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            color: var(--text-main);
        }

        th, td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            padding: 5px;
            transition: color 0.2s var(--ease-in-out);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .delete-btn:hover {
            color: var(--accent-red);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"], input[type="number"], input[type="date"] {
            flex: 1;
            background-color: #1A1A1A;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            transition: border-color 0.2s var(--ease-in-out);
        }

        input[type="date"] { flex: 0.5; }
        input[type="number"] { flex: 0.5; }
        input[type="text"] { flex: 2; }

        ::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.6;
            cursor: pointer;
        }

        input:focus {
            outline: none;
            border-color: rgba(96, 165, 250, 0.5);
            box-shadow: 0 0 10px rgba(96, 165, 250, 0.1);
        }

        button.neon-btn {
            background-color: var(--bg-inner);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 30px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.2s, border-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button.neon-btn:hover {
            background-color: #1F2937;
            border-color: rgba(96, 165, 250, 0.4);
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <div class="sidebar">
            <div class="sidebar-logo"><i class="fas fa-coins"></i> Owen's Tracker</div>
            <!-- Update the active class depending on which page you paste this into -->
            <a href="dashboard.html" class="sidebar-menu-item"><i class="fas fa-th-large"></i> Dashboard</a>
            <a href="entries.html" class="sidebar-menu-item"><i class="fas fa-list"></i> Entries</a>
            <a href="grocery.html" class="sidebar-menu-item"><i class="fas fa-shopping-cart"></i> Groceries</a>
            
            <div style="margin-top: auto;">
                <a href="settings.html" class="sidebar-menu-item"><i class="fas fa-cog"></i> Settings</a>
            </div>
        </div>

        <div class="content-area">
            
            <div class="main-dashboard-content">
                
                <div class="header">
                    <h1>2027 Grocery Tracker</h1>
                </div>

                <div class="panels-grid">
                    
                    <div class="panel">
                        <div class="panel-header">
                            <h2>Weekly Grocery Bills</h2>
                        </div>
                        
                        <form class="input-group">
                            <input type="date" required>
                            <input type="number" placeholder="Total Bill ($)" step="0.01" required>
                            <input type="text" placeholder="Notes (e.g., Week 1, Walmart, bulk rice)" required>
                            <button type="button" class="neon-btn"><i class="fas fa-plus"></i> Add Bill</button>
                        </form>

                        <table>
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Total Amount</th>
                                    <th>Notes</th>
                                    <th style="width: 30px;"></th> 
                                </tr>
                            </thead>
                            <tbody id="grocery-table-body">
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'owens_tracker_data';

        // Utility formatter
        const moneyFormatter = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });

        function updateTables() {
            let db = JSON.parse(localStorage.getItem(STORAGE_KEY));

            const groceryTbody = document.getElementById('grocery-table-body');
            groceryTbody.innerHTML = '';

            if (db && db.grocery_entries) {
                const sortedGrocery = [...db.grocery_entries].sort((a, b) => new Date(b.date) - new Date(a.date));
                sortedGrocery.forEach(entry => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${entry.date}</td>
                        <td style="color: var(--accent-red); font-weight: 600;">${moneyFormatter.format(entry.amount)}</td>
                        <td>${entry.notes}</td>
                        <td><button class="delete-btn" onclick="deleteEntry(this)"><i class="fas fa-trash"></i></button></td>
                    `;
                    groceryTbody.appendChild(tr);
                });
            }
        }

        function deleteEntry(button) {
            if (confirm("Are you sure you want to delete this grocery entry?")) {
                button.closest('tr').remove();
            }
        }

        // Initialize tables on page load
        updateTables();

        // Listen for storage events (e.g. if cleared from settings page)
        window.addEventListener('storage', (event) => {
            if (event.key === STORAGE_KEY) {
                updateTables();
            }
        });
    </script>

</body>
</html>
